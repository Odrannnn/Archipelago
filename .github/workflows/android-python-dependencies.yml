name: Android Python dependencies

on:
  pull_request:
    paths:
      - '.github/workflows/android-python-dependencies.yml'
      - 'android/companion/native-dependencies/**'
  push:
    paths:
      - '.github/workflows/android-python-dependencies.yml'
      - 'android/companion/native-dependencies/**'
  workflow_dispatch:
    inputs:
      package:
        description: Exact PyPI package name
        required: true
        type: string
        default: py-randomprime
      version:
        description: Exact PyPI package version
        required: true
        type: string
        default: 1.31.1
      module:
        description: Python module which the package must provide
        required: true
        type: string
        default: py_randomprime
      strategy:
        description: Prefer a committed adapter when available, or force a path
        required: true
        type: choice
        default: auto
        options:
          - auto
          - generic
          - adapter
      minimum_sdk:
        description: Minimum Android API supported by the artifact
        required: true
        type: choice
        default: '26'
        options:
          - '26'
      publish:
        description: Publish to the verified build cache (main only)
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: android-python-dependency-${{ github.event.inputs.package || 'py-randomprime' }}-${{ github.event.inputs.version || '1.31.1' }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    outputs:
      request_id: ${{ steps.request.outputs.request_id }}
    env:
      REQUEST_PACKAGE: ${{ github.event.inputs.package || 'py-randomprime' }}
      REQUEST_VERSION: ${{ github.event.inputs.version || '1.31.1' }}
      REQUEST_MODULE: ${{ github.event.inputs.module || 'py_randomprime' }}
      REQUEST_STRATEGY: ${{ github.event.inputs.strategy || 'auto' }}
      REQUEST_MINIMUM_SDK: ${{ github.event.inputs.minimum_sdk || '26' }}
      RELEASE_TAG: android-python-dependencies
      INDEX_FILE: android-python-dependencies-v1.json
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          persist-credentials: false

      - name: Refuse publishing outside main
        if: ${{ github.event.inputs.publish == 'true' && github.ref != 'refs/heads/main' }}
        run: |
          echo "Dependency publishing is restricted to main." >&2
          exit 1

      - name: Set up Python
        uses: actions/setup-python@v6.2.0
        with:
          python-version: '3.12'

      - name: Test dependency builder
        run: python -m unittest discover -s android/companion/native-dependencies/tests -v

      - name: Resolve and pin build request
        id: request
        run: |
          python android/companion/native-dependencies/scripts/resolve_build_request.py \
            --package "$REQUEST_PACKAGE" \
            --version "$REQUEST_VERSION" \
            --module "$REQUEST_MODULE" \
            --strategy "$REQUEST_STRATEGY" \
            --python-version 3.12 \
            --android-abi arm64-v8a \
            --minimum-sdk "$REQUEST_MINIMUM_SDK" \
            --recipes android/companion/native-dependencies/recipes \
            --output build-request.json

      - name: Set up Android SDK and NDK
        uses: android-actions/setup-android@v3.2.2
      - name: Install adapter Android NDK
        if: ${{ steps.request.outputs.strategy == 'adapter' }}
        run: |
          sdkmanager "ndk;27.2.12479018"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - name: Read committed adapter toolchains
        if: ${{ steps.request.outputs.strategy == 'adapter' }}
        id: recipe
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          request = json.loads(Path("build-request.json").read_text(encoding="utf-8"))
          path = Path(request["adapter"])
          recipe = json.loads(path.read_text(encoding="utf-8"))
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"path={path.as_posix()}\n")
              output.write(f"rust={recipe['rust_toolchain']}\n")
              output.write(f"target={recipe['rust_target']}\n")
              output.write(f"extra_targets={' '.join(recipe.get('additional_rust_targets', []))}\n")
          PY

      - name: Install pinned Rust toolchain
        if: ${{ steps.request.outputs.strategy == 'adapter' }}
        run: |
          rustup toolchain install "${{ steps.recipe.outputs.rust }}" --profile minimal
          rustup target add --toolchain "${{ steps.recipe.outputs.rust }}" "${{ steps.recipe.outputs.target }}"
          for target in ${{ steps.recipe.outputs.extra_targets }}; do
            rustup target add --toolchain "${{ steps.recipe.outputs.rust }}" "$target"
          done
          cargo +${{ steps.recipe.outputs.rust }} install cargo-ndk --version 3.5.4 --locked

      - name: Build with committed adapter
        if: ${{ steps.request.outputs.strategy == 'adapter' }}
        run: |
          python android/companion/native-dependencies/scripts/build_dependency.py \
            --recipe "${{ steps.recipe.outputs.path }}" \
            --output dist

      - name: Check out pinned Chaquopy CPython 3.12 builder
        if: ${{ steps.request.outputs.strategy == 'generic-chaquopy' }}
        uses: actions/checkout@v6.0.2
        with:
          repository: chaquo/chaquopy
          ref: e01057c72fdd737f202bd1be1de85af51e06cad0
          path: _chaquopy
          persist-credentials: false

      - name: Install pinned generic build toolchain
        if: ${{ steps.request.outputs.strategy == 'generic-chaquopy' }}
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends patchelf
          python -m pip install -r _chaquopy/server/pypi/requirements.txt
          _chaquopy/target/download-target.sh \
            _chaquopy/maven/com/chaquo/python/target/3.12.12-0

      - name: Build hash-pinned source generically
        if: ${{ steps.request.outputs.strategy == 'generic-chaquopy' }}
        run: |
          python android/companion/native-dependencies/scripts/build_generic_dependency.py \
            --request build-request.json \
            --chaquopy-root _chaquopy \
            --output dist

      - name: Validate packaged dependency without loading it
        run: |
          python android/companion/native-dependencies/scripts/validate_dependency.py \
            --entry dist/catalog-entry.json \
            --artifact-directory dist \
            --report dist/validation-report.json

      - name: Create catalog
        run: |
          python android/companion/native-dependencies/scripts/merge_catalog.py \
            --entry dist/catalog-entry.json \
            --output "dist/$INDEX_FILE"

      - name: Store validated package
        uses: actions/upload-artifact@v7.0.0
        with:
          name: android-python-${{ env.REQUEST_ID }}
          path: |
            dist/*.zip
            dist/${{ env.INDEX_FILE }}
            dist/catalog-entry.json
            dist/validation-report.json
            build-request.json
          if-no-files-found: error
          retention-days: 14

  publish:
    if: ${{ github.event.inputs.publish == 'true' && github.ref == 'refs/heads/main' }}
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      REQUEST_ID: ${{ needs.build.outputs.request_id }}
      RELEASE_TAG: android-python-dependencies
      INDEX_FILE: android-python-dependencies-v1.json
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          persist-credentials: false
      - name: Download validated build
        uses: actions/download-artifact@v8.0.1
        with:
          name: android-python-${{ steps.request.outputs.request_id }}
          path: dist

      - name: Revalidate downloaded dependency
        run: |
          python android/companion/native-dependencies/scripts/validate_dependency.py \
            --entry dist/catalog-entry.json \
            --artifact-directory dist \
            --report dist/publish-validation-report.json

      - name: Attest validated dependency package
        uses: actions/attest-build-provenance@v3.0.0
        with:
          subject-path: dist/*.zip

      - name: Merge existing published catalog
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p previous
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release download "$RELEASE_TAG" --pattern "$INDEX_FILE" --dir previous || true
          else
            gh release create "$RELEASE_TAG" --target main --title "Android Python dependencies" \
              --notes "Verified native Python build cache for Archipelago Companion Android." --prerelease
          fi
          MERGE_ARGS=(--entry dist/catalog-entry.json --output "dist/$INDEX_FILE")
          if [ -f "previous/$INDEX_FILE" ]; then
            MERGE_ARGS+=(--existing "previous/$INDEX_FILE")
          fi
          python android/companion/native-dependencies/scripts/merge_catalog.py "${MERGE_ARGS[@]}"

      - name: Publish package and verified build cache
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$RELEASE_TAG" dist/*.zip "dist/$INDEX_FILE" --clobber
