name: Android Python dependencies

on:
  pull_request:
    paths:
      - '.github/workflows/android-python-dependencies.yml'
      - 'android/companion/native-dependencies/**'
  push:
    paths:
      - '.github/workflows/android-python-dependencies.yml'
      - 'android/companion/native-dependencies/**'
  workflow_dispatch:
    inputs:
      recipe:
        description: Android cross-build adapter
        required: true
        type: choice
        default: py-randomprime-1.31.1
        options:
          - py-randomprime-1.31.1
      publish:
        description: Publish to the verified build cache (main only)
        required: true
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write
  attestations: write

concurrency:
  group: android-python-dependency-${{ github.event.inputs.recipe || 'validation' }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      RECIPE_ID: ${{ github.event.inputs.recipe || 'py-randomprime-1.31.1' }}
      RELEASE_TAG: android-python-dependencies
      INDEX_FILE: android-python-dependencies-v1.json
    steps:
      - uses: actions/checkout@v6.0.2

      - name: Refuse publishing outside main
        if: ${{ github.event.inputs.publish == 'true' && github.ref != 'refs/heads/main' }}
        run: |
          echo "Dependency publishing is restricted to main." >&2
          exit 1

      - name: Set up Python
        uses: actions/setup-python@v6.2.0
        with:
          python-version: '3.12'

      - name: Set up Android SDK and NDK
        uses: android-actions/setup-android@v3.2.2
      - name: Install Android NDK
        run: |
          sdkmanager "ndk;27.2.12479018"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - name: Read pinned Rust toolchain and targets
        id: recipe
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          recipe_id = os.environ["RECIPE_ID"]
          allowed = {path.stem: path for path in Path("android/companion/native-dependencies/recipes").glob("*.json")}
          if recipe_id not in allowed:
              raise SystemExit(f"Unknown Android build adapter: {recipe_id}")
          recipe = json.loads(allowed[recipe_id].read_text(encoding="utf-8"))
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"path={allowed[recipe_id].as_posix()}\n")
              output.write(f"rust={recipe['rust_toolchain']}\n")
              output.write(f"target={recipe['rust_target']}\n")
              output.write(f"extra_targets={' '.join(recipe.get('additional_rust_targets', []))}\n")
          PY

      - name: Test dependency builder
        run: python -m unittest discover -s android/companion/native-dependencies/tests -v

      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install "${{ steps.recipe.outputs.rust }}" --profile minimal
          rustup target add --toolchain "${{ steps.recipe.outputs.rust }}" "${{ steps.recipe.outputs.target }}"
          for target in ${{ steps.recipe.outputs.extra_targets }}; do
            rustup target add --toolchain "${{ steps.recipe.outputs.rust }}" "$target"
          done
          cargo +${{ steps.recipe.outputs.rust }} install cargo-ndk --version 3.5.4 --locked

      - name: Build hash-pinned upstream source
        run: |
          python android/companion/native-dependencies/scripts/build_dependency.py \
            --recipe "${{ steps.recipe.outputs.path }}" \
            --output dist

      - name: Verify packaged Android ELF
        run: |
          python - <<'PY'
          import json, zipfile
          from pathlib import Path
          entry = json.loads(Path("dist/catalog-entry.json").read_text(encoding="utf-8"))
          artifact = Path("dist") / entry["file_name"]
          with zipfile.ZipFile(artifact) as package:
              manifest = json.loads(package.read("dependency.json"))
              assert manifest["source_sha256"] == entry["source_sha256"]
              native = [name for name in package.namelist() if name.endswith(".so")]
              assert native, "package contains no native extension"
              package.extract(native[0], "elf-check")
              print(Path("elf-check") / native[0])
          PY
          ELF_FILE=$(find elf-check -type f -name '*.so' -print -quit)
          readelf -h "$ELF_FILE" | tee dist/elf-header.txt
          readelf -h "$ELF_FILE" | grep -q 'Machine:.*AArch64'

      - name: Create catalog
        run: |
          python android/companion/native-dependencies/scripts/merge_catalog.py \
            --entry dist/catalog-entry.json \
            --output "dist/$INDEX_FILE"

      - name: Attest dependency package
        if: ${{ github.event_name == 'workflow_dispatch' }}
        uses: actions/attest-build-provenance@v3.0.0
        with:
          subject-path: dist/*.zip

      - name: Store validated package
        uses: actions/upload-artifact@v7.0.0
        with:
          name: android-python-${{ env.RECIPE_ID }}
          path: |
            dist/*.zip
            dist/${{ env.INDEX_FILE }}
            dist/catalog-entry.json
            dist/elf-header.txt
          if-no-files-found: error
          retention-days: 14

  publish:
    if: ${{ github.event.inputs.publish == 'true' && github.ref == 'refs/heads/main' }}
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      RECIPE_ID: ${{ github.event.inputs.recipe }}
      RELEASE_TAG: android-python-dependencies
      INDEX_FILE: android-python-dependencies-v1.json
    steps:
      - uses: actions/checkout@v6.0.2
      - name: Download validated build
        uses: actions/download-artifact@v8.0.1
        with:
          name: android-python-${{ env.RECIPE_ID }}
          path: dist

      - name: Merge existing published catalog
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p previous
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release download "$RELEASE_TAG" --pattern "$INDEX_FILE" --dir previous || true
          else
            gh release create "$RELEASE_TAG" --target main --title "Android Python dependencies" \
              --notes "Verified native Python build cache for Archipelago Companion Android." --prerelease
          fi
          MERGE_ARGS=(--entry dist/catalog-entry.json --output "dist/$INDEX_FILE")
          if [ -f "previous/$INDEX_FILE" ]; then
            MERGE_ARGS+=(--existing "previous/$INDEX_FILE")
          fi
          python android/companion/native-dependencies/scripts/merge_catalog.py "${MERGE_ARGS[@]}"

      - name: Publish package and verified build cache
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$RELEASE_TAG" dist/*.zip "dist/$INDEX_FILE" --clobber
